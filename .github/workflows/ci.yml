name: CI — DIGITAL MARKET Platform

on:
  push:
    branches: [main, fix/production-hardening]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Full Validation Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: platform/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Install platform dependencies
        working-directory: platform
        run: npm ci

      - name: Lint (if configured)
        working-directory: platform
        run: npm run lint --if-present
        continue-on-error: true

      - name: Build
        working-directory: platform
        run: npm run build

      - name: Run interview, persistence, security, UI and regression tests
        working-directory: platform
        run: npm run validate && npm run test:leakage

      - name: Install Chromium for browser tests
        working-directory: platform
        run: npx playwright install --with-deps chromium

      - name: Run real browser journeys on desktop and mobile
        working-directory: platform
        run: npm run test:browser

      - name: Save browser failure screenshots and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-failures
          path: platform/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Run Python system validation
        run: python scripts/validate_system.py

      - name: Run 753 business simulation
        working-directory: platform
        run: npm run test:753
        timeout-minutes: 10
